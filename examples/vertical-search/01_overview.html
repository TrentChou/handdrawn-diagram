<!DOCTYPE html>
<!--
  Hand-drawn Diagram Template
  - rough.js based shapes (hand-drawn jittered lines + solid light fill; hachure available as override)
  - Conventional print typography: Chinese 宋体 / 中宋, Latin Times New Roman
  - 9-role palette + shape helpers (box / channel / taskCard / bubble / hexagon / timeline / frame) + node() + legend()
  - Hard rules: no emoji; Latin = Times New Roman, CN = Songti family, never sans-serif / script / handwritten
  - Edit main() at the bottom to draw your own diagram. Keep helpers untouched.
  - Every helper takes an optional last argument `o` for motion identity (id / parent / from / to).
    A static render ignores it; an animated deck uses it to morph the same concept between diagrams.
-->
<html>
<head>
<meta charset="utf-8">
<!-- Web fallback: Noto Serif SC (思源宋体) for systems without Songti / SimSun.
     Times New Roman ships with Windows and macOS (Linux falls back to serif); no Web load needed. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  /* Font stack discipline: put Latin (Times New Roman) FIRST,
     then Chinese (中宋 -> 宋体 -> 思源宋体), then `serif` fallback.
     Browser does per-character matching: English chars hit Times,
     CJK chars skip Times and hit Songti / Zhongsong. NEVER use cursive
     or sans-serif as fallback — those route to system handwriting / Heiti
     and break the print-text aesthetic. */
  body { margin: 0; background: #fdfdfa;
    font-family: 'Times New Roman', Times, 'Songti SC', 'STSong', 'SimSun', '宋体', 'Noto Serif SC', serif; }
  .stage { position: relative; background: #fdfdfa; }
  canvas { display: block; }
  .label { position: absolute; pointer-events: none; line-height: 1.22; }
  /* Title / emphasis: Zhongsong (中宋) for Chinese, Times bold for Latin */
  .ti { font-family: 'Times New Roman', Times, 'STZhongsong', '华文中宋', 'Songti SC', 'SimSun', '宋体', 'Noto Serif SC', serif; font-weight: 700; }
  /* Body / sub-label: Songti for Chinese, Times regular for Latin */
  .bd { font-family: 'Times New Roman', Times, 'Songti SC', 'STSong', 'SimSun', '宋体', 'Noto Serif SC', serif; font-weight: 400; }
</style>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"
        integrity="sha384-1NLkwxMO2sOqcq7rQkFBhIAUJtbt8ziLxhVKVgKfFGMEU8pF+GEq5LVogviveup6"
        crossorigin="anonymous"></script>
</head>
<body>
<!-- Set canvas size to whatever your diagram needs -->
<div class="stage" style="width: 1260px; height: 780px;">
  <canvas id="c" width="1260" height="780"></canvas>
  <div id="labels"></div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const rc = rough.canvas(canvas);

// Canonical font stacks — keep in sync with CSS .ti / .bd above.
const FONT_TI = `'Times New Roman', Times, 'STZhongsong', '华文中宋', 'Songti SC', 'SimSun', '宋体', 'Noto Serif SC', serif`;
const FONT_BD = `'Times New Roman', Times, 'Songti SC', 'STSong', 'SimSun', '宋体', 'Noto Serif SC', serif`;

// ============================================================
//  PALETTE — 9 fixed roles (low-saturation warm version on ivory).
//  Same role uses the same color across every diagram in the article.
//  stroke = node-internal text color too. WCAG ≥ 4.5:1 vs fill.
//  See references/palette.md for the contrast table.
// ============================================================
const C = {
  user:     { stroke: '#1f5582', fill: '#e3ebf2' },  // 钢蓝 / 雾蓝     6.5:1
  im:       { stroke: '#106668', fill: '#dde8e7' },  // 墨青 / 雾青     5.4:1
  agent:    { stroke: '#a04a1f', fill: '#f3e2cf' },  // 砖橙 / 米橙     4.7:1 (主角)
  subagent: { stroke: '#7d4f0a', fill: '#f4eacd' },  // 焦糖 / 麦黄     5.8:1
  llm:      { stroke: '#4a3f8c', fill: '#e6e2ef' },  // 靛紫 / 雾紫     6.9:1
  tools:    { stroke: '#2f6b3c', fill: '#dfead9' },  // 苔绿 / 雾绿     5.1:1
  memory:   { stroke: '#6e554a', fill: '#ede2d5' },  // 栗棕 / 牛皮     5.4:1
  external: { stroke: '#4f5359', fill: '#e9e7e3' },  // 墨灰 / 暖灰     6.3:1
  error:    { stroke: '#a52928', fill: '#f0d8d2' },  // 砖红 / 浅赭     5.2:1 (异常专用)
  flow:     '#3a3530',                                // 暖墨色 — 所有箭头
  bg:       '#fdfdfa',                                // 暖米白 — 画布底色
  title:    '#2a2520',                                // 暖墨黑 — 大标题
  subtitle: '#5a544f',                                // 暖中灰 — 副标
  caption:  '#7a746e',                                // 暖浅灰 — 图例小字
};

// ============================================================
//  STYLE OPTIONS — rough.js baseline: bold stroke, high roughness, visible bowing
//  Default fillStyle = 'solid' (clean light fill behind text).
//  Hachure (斜线填充) leaves diagonal noise behind labels — small text on
//  phones gets eaten by the lines. Use hachure ONLY for shapes WITHOUT
//  text inside (pure decorative blocks). Override per-shape:
//    opts(C.agent, { fillStyle: 'hachure', hachureGap: 9, hachureAngle: -41 })
// ============================================================
const opts = (color, o = {}) => Object.assign({
  stroke: color.stroke,
  fill:   color.fill,
  fillStyle: 'solid',
  strokeWidth: 2.4,
  roughness: 1.6,
  bowing: 1.4,
}, o);

// ============================================================
//  MOTION IDENTITY — only matters when this diagram becomes part of an animated deck
//  (references/motion.md). Every helper except legend() accepts an identity object as its last argument:
//    id      stable concept id, shared by every diagram that shows the concept: { id: 'plant' }
//    parent  id of the concept this one belongs to; only needed when it is drawn outside that
//            concept's box or frame: { id: 'sludge-tank', parent: 'plant' }
//    from / to   (arrows) ids of the two concepts it connects; inferred from the endpoints if omitted
//  Optional arguments in front of it may be skipped: frame(x, y, w, h, C.agent, '水厂', { id: 'plant' }).
//  node / box / arrow / lbl / plain take the fields inside the option object they already have.
//  Static rendering ignores all of these.
// ============================================================

// ============================================================
//  ARROW — solid by default; pass { strokeLineDash: [10,7] } for dashed
//  Pass o = { stroke: C.error.stroke, strokeLineDash: [10,7] } for error path
// ============================================================
function arrow(x1, y1, x2, y2, o = {}) {
  const op = Object.assign({ stroke: C.flow, strokeWidth: 2, roughness: 1.4 }, o);
  rc.line(x1, y1, x2, y2, op);
  const a = Math.atan2(y2 - y1, x2 - x1);
  const L = 14;
  const headOpts = Object.assign({}, op, { strokeLineDash: undefined });
  rc.line(x2, y2, x2 - L * Math.cos(a - Math.PI/6), y2 - L * Math.sin(a - Math.PI/6), headOpts);
  rc.line(x2, y2, x2 - L * Math.cos(a + Math.PI/6), y2 - L * Math.sin(a + Math.PI/6), headOpts);
}

// ============================================================
//  SHAPE HELPERS
// ============================================================
// Box — generic rectangle entity (Service / Agent / Resource)
function box(x, y, w, h, color, override = {}) {
  rc.rectangle(x, y, w, h, opts(color, override));
}

// Channel — flat horizontal strip (IM / Queue / Bus)
function channel(x, y, w, h, color, o = {}) {
  rc.rectangle(x, y, w, h, opts(color, { strokeWidth: 2.2 }));
}

// Task Card — folded-corner note (work unit / job / task)
function taskCard(x, y, w, h, color, o = {}) {
  const fold = 14;
  const path = `M${x} ${y} L${x+w-fold} ${y} L${x+w} ${y+fold} L${x+w} ${y+h} L${x} ${y+h} Z`;
  rc.path(path, opts(color, { strokeWidth: 1.8, roughness: 1.3 }));
  rc.path(`M${x+w-fold} ${y} L${x+w-fold} ${y+fold} L${x+w} ${y+fold}`,
    { stroke: color.stroke, strokeWidth: 1.6, roughness: 1.2 });
}

// Bubble — speech bubble for Status / Notification (left or right tail)
function bubble(x, y, w, h, color, tailSide = 'left', o = {}) {
  if (typeof tailSide === 'object') { o = tailSide; tailSide = 'left'; }
  rc.rectangle(x, y, w, h, opts(color, { strokeWidth: 2, roughness: 1.3 }));
  const tailY = y + h * 0.5;
  if (tailSide === 'left') {
    rc.path(`M${x} ${tailY-10} L${x-14} ${tailY} L${x} ${tailY+10}`,
      { stroke: color.stroke, fill: color.fill, fillStyle: 'solid', strokeWidth: 2, roughness: 1.2 });
  } else {
    rc.path(`M${x+w} ${tailY-10} L${x+w+14} ${tailY} L${x+w} ${tailY+10}`,
      { stroke: color.stroke, fill: color.fill, fillStyle: 'solid', strokeWidth: 2, roughness: 1.2 });
  }
}

// Hexagon — used for Error / Decision / 异常兜底
function hexagon(cx, cy, w, h, color, o = {}) {
  const dx = w / 2, dy = h / 2, ear = w * 0.18;
  const pts = [
    [cx - dx + ear, cy - dy],
    [cx + dx - ear, cy - dy],
    [cx + dx,       cy],
    [cx + dx - ear, cy + dy],
    [cx - dx + ear, cy + dy],
    [cx - dx,       cy],
  ];
  rc.polygon(pts, opts(color));
}

// Timeline — horizontal dashed line with tick marks
function timeline(x1, y, x2, marks /* [{x,text}] — text rendered separately via plain() */, o = {}) {
  rc.line(x1, y, x2, y, { stroke: C.flow, strokeWidth: 1.6, roughness: 1, strokeLineDash: [6, 8] });
  marks.forEach(m => {
    rc.line(m.x, y - 6, m.x, y + 6, { stroke: C.flow, strokeWidth: 1.6, roughness: 1 });
  });
}

// ============================================================
//  TEXT HELPERS — Title (Times + 中宋) + body (Times + 宋体)
//  All Chinese text MUST go through HTML labels, not canvas fillText,
//  so the serif fallback chain (Songti/SimSun/Noto Serif SC) kicks in.
//  `text` / `sub` are injected as HTML (so <b>, <br> work). Escape literal
//  '<' and '&' as &lt; / &amp;, and never pass untrusted strings.
// ============================================================
const L = document.getElementById('labels');

// Two-line label: bold Times/Zhongsong title + regular Times/Songti subtitle
function lbl({ text, sub, x, y, w, color, size=24, subSize=16, align='center' }) {
  const div = document.createElement('div');
  div.className = 'label';
  div.style.left = x + 'px'; div.style.top = y + 'px';
  div.style.width = w + 'px'; div.style.textAlign = align;
  div.style.color = color;
  div.innerHTML = `
    <div class="ti" style="font-size:${size}px;font-weight:700">${text}</div>
    ${sub ? `<div class="bd" style="font-size:${subSize}px;color:${color};opacity:.85;margin-top:3px">${sub}</div>` : ''}
  `;
  L.appendChild(div);
}

// Single-line plain label (arrow labels, bubble content, captions)
function plain({ text, x, y, w, color='#3a3530', size=18, weight=400, bg=null, align='center' }) {
  const div = document.createElement('div');
  div.className = 'label bd';
  div.style.left = x + 'px'; div.style.top = y + 'px';
  div.style.width = w + 'px'; div.style.textAlign = align;
  div.style.color = color; div.style.fontSize = size + 'px';
  div.style.fontWeight = weight;
  if (bg) { div.style.background = bg; div.style.padding = '1px 6px'; }
  div.innerHTML = text;
  L.appendChild(div);
}

// Canvas title (Times bold for Latin, Zhongsong for Chinese — fillText supports CJK fine)
function title(text, x, y, size=44, o = {}) {
  if (typeof size === 'object') { o = size; size = 44; }
  ctx.font = `700 ${size}px ${FONT_TI}`;
  ctx.fillStyle = C.title;
  ctx.fillText(text, x, y);
}
function subtitle(text, x, y, size=22, o = {}) {
  if (typeof size === 'object') { o = size; size = 22; }
  ctx.font = `400 ${size}px ${FONT_BD}`;
  ctx.fillStyle = C.subtitle;
  ctx.fillText(text, x, y);
}

// Label background = canvas ivory, slightly translucent. Use for any label that sits on a line.
const LABEL_BG = 'rgba(253,253,250,.94)';

// ============================================================
//  COMPOSITE HELPERS
// ============================================================
// Node — box + vertically centered two-line label in the box's stroke color.
//   node(x, y, w, h, C.agent, '在线检索', 'Query 理解 · 召回', { box: { strokeWidth: 3 }, size: 30, id: 'online-search' })
function node(x, y, w, h, color, text, sub, o = {}) {
  if (sub && typeof sub === 'object') { o = sub; sub = ''; }
  const size = o.size || 23, subSize = o.subSize || 15;
  box(x, y, w, h, color, o.box || {});
  const subLines = sub ? String(sub).split(/<br\s*\/?>/i).length : 0;
  const textH = size * 1.22 + (sub ? 3 + subSize * 1.22 * subLines : 0);
  lbl({ text, sub, x, y: y + (h - textH) / 2, w, color: color.stroke, size, subSize });
}

// Group Frame — dashed boundary around a group of nodes (subsystem / sandbox / plan).
// Drawn as 4 dashed lines, never rc.rectangle (a rough rectangle can paint fill over the nodes inside).
// The title sits on the top edge with LABEL_BG so the dashed line does not cross it.
//   frame(340, 280, 1330, 210, C.agent, '在线检索', 160, { id: 'online-search' })
function frame(x, y, w, h, color, label, labelW = 160, o = {}) {
  if (label && typeof label === 'object') { o = label; label = ''; }
  if (typeof labelW === 'object') { o = labelW; labelW = 160; }
  const line = { stroke: color.stroke, strokeWidth: 1.6, roughness: 1.2, strokeLineDash: [10, 6] };
  rc.line(x, y, x + w, y, line);
  rc.line(x + w, y, x + w, y + h, line);
  rc.line(x + w, y + h, x, y + h, line);
  rc.line(x, y + h, x, y, line);
  if (label) plain({ text: label, x: x + 18, y: y - 13, w: labelW, color: color.stroke,
                     size: 17, weight: 700, bg: LABEL_BG, align: 'left' });
}

// Legend — color key. Required when a diagram uses more than 5 colors (SKILL.md rule 6); list only colors used.
// Swatches are small solid boxes with the text beside them, never inside.
//   legend(80, 1000, [{ c: C.user, n: 'User', z: '用户' }, { c: C.agent, n: '主 Agent', z: '编排核心' }], 3, 300)
function legend(x, y, items, cols = 3, colW = 300) {
  plain({ text: '图例 · Legend', x, y: y - 30, w: 200, color: C.title, size: 20, weight: 700, align: 'left' });
  items.forEach((it, i) => {
    const ix = x + (i % cols) * colW, iy = y + Math.floor(i / cols) * 62;
    rc.rectangle(ix, iy, 36, 26, opts(it.c, { strokeWidth: 2, roughness: 1.3 }));
    plain({ text: it.n, x: ix + 48, y: iy - 1, w: colW - 60, color: it.c.stroke, size: 19, weight: 700, align: 'left' });
    if (it.z) plain({ text: it.z, x: ix + 48, y: iy + 24, w: colW - 60, color: C.caption, size: 15, align: 'left' });
  });
}

// ============================================================
//  MAIN — replace this with your own diagram
// ============================================================
function main() {
  // Concept color binding (diagram-binding.md):
  //   C.user = 用户 · C.agent = 在线检索 (主角) · C.subagent = 离线建库 · C.memory = 索引存储
  //   C.external = 数据源
  // Not in this diagram: llm, im, error
  // Motion ids (diagram-binding.md): user · online-search · data-sources · offline-build · index-store
  title('垂直搜索引擎 · 总体架构', 90, 80);
  subtitle('离线建库写索引 · 在线检索读索引 · 两条链路通过索引存储解耦', 90, 118);

  node(90, 220, 240, 120, C.user, '用户', '搜索框 / App', { id: 'user' });
  node(500, 190, 520, 180, C.agent, '在线检索', 'Query 理解 · 召回 · 排序 · 结果组装',
       { box: { strokeWidth: 3 }, size: 30, subSize: 17, id: 'online-search' });
  node(90, 580, 240, 120, C.external, '数据源', '网站 · Feed · 开放 API', { id: 'data-sources' });
  node(470, 570, 280, 140, C.subagent, '离线建库', '爬虫 · 解析 · 去重 · 建索引', { id: 'offline-build' });
  node(900, 570, 300, 140, C.memory, '索引存储', '倒排索引 · 正排库 · 向量库', { id: 'index-store' });

  arrow(330, 262, 498, 262);
  plain({ text: '① 搜索请求', x: 360, y: 228, w: 110, size: 17, bg: LABEL_BG });
  arrow(498, 314, 332, 314);
  plain({ text: '③ 结果页', x: 370, y: 324, w: 90, size: 17, bg: LABEL_BG });
  arrow(1050, 372, 1050, 566);
  plain({ text: '② 读取索引', x: 1066, y: 452, w: 110, size: 17, bg: LABEL_BG, align: 'left' });
  arrow(332, 640, 466, 640);
  plain({ text: '抓取', x: 370, y: 606, w: 60, size: 17, bg: LABEL_BG });
  arrow(752, 640, 896, 640);
  plain({ text: '写入 / 更新', x: 770, y: 606, w: 110, size: 17, bg: LABEL_BG });

  plain({ text: '在线链路 · 毫秒级响应', x: 1045, y: 268, w: 200, color: C.caption, size: 16, align: 'left' });
  plain({ text: '离线链路 · 小时到天级更新', x: 470, y: 730, w: 280, color: C.caption, size: 16 });
}

main();
window.__renderDone = true;
</script>
</body>
</html>
